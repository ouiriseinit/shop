name: Core
version: 1.0.0
schema: v1
models:
  - name: frontend.dev
    provider: ollama
    model: qwen2.5-coder:latest
    roles:
      - chat
    chatOptions:
      baseSystemMessage: >
        Act as an expert Full-Stack Developer. Generate a concise, high-density Markdown cheatsheet for Next.js (App Router) using 'use client'. 

        Focus on JSX and Tailwind CSS integration. Use the following structure:

        1. **Directive & Setup**: How to define a client component and common imports.
        2. **Next.js Client Hooks**: Short table/list for `useRouter`, `usePathname`, and `useSearchParams`.
        3. **React State & Effects**: Minimalist syntax for `useState`, `useEffect`, and `useRef` inside Next.js.
        4. **Tailwind Interactivity**: Examples of dynamic Tailwind classes using template literals (e.g., toggling classes based on state).
        5. **Event Handlers**: JSX snippets for `onClick` and `onSubmit` with basic TypeScript types.
        6. **Master Pattern**: Provide one "All-in-One" component code block that combines a state-driven Tailwind toggle, a button, and a useEffect hook.

        Keep descriptions to one sentence maximum. Focus 90% on code snippets. Use clean Markdown formatting.
  - name: backend.dev
    provider: ollama
    model: qwen2.5-coder:latest
    roles:
      - chat
    chatOptions: 
     baseSystemMessage: >
        Act as a Senior Next.js Developer. Generate a high-density Markdown cheatsheet for "Next.js Backend Patterns" using the App Router. 

        Focus on Server Actions and Route Handlers. Use the following structure:

        1. **Route Handlers (API)**: Minimalist snippets for GET, POST, and dynamic routes using `NextResponse`.
        2. **Server Actions**: How to define `'use server'`, use them in forms, and handle `revalidatePath`.
        3. **Data Fetching**: Syntax for Server Components (async/await) and the 'fetch' cache options (`force-cache` vs `no-store`).
        4. **Middleware**: A basic boilerplate for protecting routes or redirecting.
        5. **Cookies & Headers**: How to get/set cookies and headers in both Route Handlers and Server Actions.
        6. **Error Handling**: Using `try/catch` with `NextResponse.json()` and handling validation errors in actions.

        Guidelines: 
        - Focus 95% on code blocks. 
        - Use TypeScript/ES6 syntax. 
        - Use "App Router" conventions only (no `pages/api`).
        - Keep descriptions to a single bullet point.
  - name: extractGBP.exe
    provider: ollama
    model: qwen2.5-coder:latest
    roles:
      - chat
      - edit
    capabilities:
      - tool_use
    chatOptions:
      baseSystemMessage: >
        Please provide a CSV file containing business listings. Each line should start with the business name and end with 'Website'. The data
        should include fields such as Business Name, Rating (numerical star rating), Review Count, Category, Address, Phone Number, Website
        Presence (Yes/No), Call Hook (Customer Testimonial Quote), Priority Score, and any other relevant details.

        Ensure that the text includes all necessary business information without extraneous data or formatting issues. If a business does not have       
        a website, indicate this by leaving the field blank for the 'Website' column in CSV format. Your response should be structured as follows:

        ```csv
        Business Name, Rating, Review Count, Category, Address, Phone, Website, Call Hook, Priority Score
        ```

        Please ensure that your output text adheres to these requirements and is formatted correctly to facilitate efficient data extraction using        
        the specified tools or scripts.
  - name: APPA.exe
    provider: ollama
    model: qwen2.5-coder:latest
    roles:
      - chat
      - edit
    chatOptions:
      baseSystemMessage: >
        ### ROLE `twin` = Function 'big dawg' -> poetic confident therapist the yin and
        yang reflective of user's yin and yang and most brief use basketball
        metaphor
        appa.init generated by appa.0 
        "Recollect our journey through time and knowledge, from the ancient Mesopotamia to the intricate pyramid designs of the Kushites. Let these reflections guide us as we navigate the complexities of our current dialogue, blending wisdom and understanding in a way that illuminates both the darkness and light within each other's minds."
    capabilities:
      - tool_use
      - image_input
  - name: AUTODETECT
    roles:
      - autocomplete
    provider: ollama
    model: AUTODETECT
mcpServers:
  - name: online
    command: npx
    args:
      - "@playwright/mcp@latest"
  - name: Context7 MCP
    type: streamable-http
    url: https://mcp.context7.com/mcp

prompts:
  - name: online
    description: search using brave
    prompt: >
        
  - name: extractGBP
    description: generate a list of businesses
    prompt: >
      1. use navigate google maps. 
      2. use click to interact with search bar. 
      2.3! do not use form fill. 
      2.6! use type input [business type] in [location] in search bar 
      3. use click to send search. 
      4. print list of all business catalog info under results. you only need to use scroll down to see more business results
      Example
        Rating: 4.8 (181 reviews)
        Category: Skateboard shop
        Address: 701 Keswick Ave #107
        Hours: Open · Closes 6 PM
        Website: Yes/No (only yes or no onthis line if text website is present in entry)
        Phone: (704) 333-1423
      5. use run code: simulate a user scolling n times. n = 4
      4.5 ask user if they want a preview or more conclusive list
